<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Vocabulary Learner</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --btn-bg: #2563eb;
            --btn-hover: #1d4ed8;
            --blur-bg: rgba(15, 23, 42, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px; /* 画面端の余白を少し縮小 */
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            perspective: 1000px;
        }

        .header {
            text-align: center;
            margin-bottom: 15px; /* 縦方向を縮めるためマージンを縮小 */
        }

        .header h1 {
            font-size: 1.6rem; /* 少しコンパクトに */
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* 進行状況を表示する小さなカウンタ */
        .counter {
            font-size: 0.75rem;
            color: var(--text-secondary);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px; /* 少しシャープに */
            padding: 30px 24px; /* 縦パディングを縮小 */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 18px; /* 要素間の隙間を詰め、全体をコンパクトに */
            min-height: 340px; /* 縦幅を数％縮小 */
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4);
        }

        .word-section {
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 14px;
        }

        .word {
            font-size: 2.4rem; /* 縦幅に余裕を持たせるため少し縮小 */
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            margin-bottom: 4px;
            cursor: pointer;
            display: inline-block;
            transition: color 0.2s ease;
        }
        
        .word:hover {
            color: var(--accent-blue);
        }

        .sentence-section {
            background: rgba(15, 23, 42, 0.3);
            padding: 16px;
            border-radius: 12px;
            border-left: 4px solid var(--accent-blue);
            display: flex;
            flex-direction: column;
        }

        .sentence-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .section-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent-blue);
            font-weight: 600;
        }

        .audio-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            width: 24px;
            height: 24px;
        }

        .audio-btn:hover {
            color: var(--accent-blue);
            background: rgba(255, 255, 255, 0.05);
        }

        .sentence {
            font-size: 1.05rem;
            line-height: 1.5;
            color: #e2e8f0;
            padding-right: 5px;
        }

        .answer-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: auto;
        }

        .meaning-box, .synonym-box {
            position: relative;
            background: rgba(15, 23, 42, 0.4);
            padding: 12px 16px;
            border-radius: 10px;
            overflow: hidden;
            min-height: 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .meaning, .synonym {
            font-size: 1rem;
            font-weight: 500;
            transition: filter 0.3s ease, opacity 0.3s ease;
        }

        .masked {
            filter: blur(8px);
            user-select: none;
            opacity: 0.2;
        }

        .mask-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--blur-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .hidden {
            display: none !important;
        }

        /* 3つのボタンを配置するコントロールエリア */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        button.control-btn {
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-action {
            width: 100%;
            background: var(--btn-bg);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }

        .btn-action:hover {
            background: var(--btn-hover);
        }

        .btn-nav {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-nav:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* 最初の単語で「戻る」ボタンを押せなくするスタイル */
        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
        }

        button:active {
            transform: scale(0.98);
        }

        @media (max-width: 480px) {
            .card {
                padding: 24px 16px;
                min-height: 320px;
            }
            .word {
                font-size: 2rem;
            }
            .sentence {
                font-size: 0.95rem;
            }
        }
    </style>
</head>

        <div class="controls">

            <!-- ナビゲーション用の分割ボタン（戻る・進む） -->
            <div class="nav-buttons">

        </div>

        // 戻るボタンの実装のため、これまでの出題履歴を記録するスタック
        let historyStack = [];
        let currentIndex = 0;
        let isRevealed = false;

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                
                const voices = window.speechSynthesis.getVoices();
                const enVoice = voices.find(voice => voice.lang.startsWith('en-'));
                if (enVoice) {
                    utterance.voice = enVoice;
                }
                
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function speakCurrentSentence() {
            const currentItem = vocabularyData[currentIndex];
            speakText(currentItem.sentence);
        }

        function updateCard() {
            const currentItem = vocabularyData[currentIndex];
            const card = document.getElementById('card');
            
            card.style.opacity = 0;
            card.style.transform = 'translateY(10px) scale(0.98)';
            
            setTimeout(() => {
                document.getElementById('word').textContent = currentItem.word;
                document.getElementById('sentence').textContent = currentItem.sentence;
                document.getElementById('meaning').textContent = currentItem.meaning;
                document.getElementById('synonym').textContent = currentItem.synonym;

                document.getElementById('meaning').classList.add('masked');
                document.getElementById('synonym').classList.add('masked');
                document.getElementById('meaningMask').classList.remove('hidden');
                document.getElementById('synonymMask').classList.remove('hidden');
                
                document.getElementById('actionBtn').textContent = "Show Answer";
                isRevealed = false;

                // 戻るボタンの有効・無効を制御
                document.getElementById('prevBtn').disabled = (historyStack.length === 0);

                // カウンタの更新表示（現在の位置 / 総単語数）
                const displayNum = historyStack.length + 1;
                document.getElementById('counter').textContent = `WORD ${displayNum} OF ${vocabularyData.length}`;

                card.style.opacity = 1;
                card.style.transform = 'translateY(0) scale(1)';
                
                setTimeout(() => {
                    speakText(currentItem.word);
                }, 300);
                
            }, 200);
        }

        function revealAnswers() {
            if (isRevealed) return;

            document.getElementById('meaning').classList.remove('masked');
            document.getElementById('synonym').classList.remove('masked');
            document.getElementById('meaningMask').classList.add('hidden');
            document.getElementById('synonymMask').classList.add('hidden');
            
            document.getElementById('actionBtn').textContent = "Confirmed";
            isRevealed = true;
        }

        function nextWord() {
            // 現在のインデックスを履歴に保存
            historyStack.push(currentIndex);
            
            let nextIndex = currentIndex;
            while (nextIndex === currentIndex) {
                nextIndex = Math.floor(Math.random() * vocabularyData.length);
            }
            currentIndex = nextIndex;
            updateCard();
        }

        function prevWord() {
            if (historyStack.length > 0) {
                // 履歴から直前のインデックスを取り出して戻る
                currentIndex = historyStack.pop();
                updateCard();
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = function() {};
        }

        window.onload = function() {
            // 初回起動時、履歴は空の状態で最初の単語を表示
            currentIndex = Math.floor(Math.random() * vocabularyData.length);
            updateCard();
        };
